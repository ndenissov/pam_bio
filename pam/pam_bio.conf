# Example PAM configuration snippet.
#
# Add the following line BEFORE the existing "auth" lines in:
#   /etc/pam.d/sudo   — for sudo biometric auth
#   /etc/pam.d/sddm   — for SDDM login biometric auth
#
# The "sufficient" control means: if pam_bio succeeds, authentication
# is granted immediately without asking for a password. If it fails or
# the daemon is unreachable, PAM falls through to the next module
# (typically pam_unix for password).
#
# ── Add this line ──
# auth  sufficient  pam_bio.so
#
# ── Example full /etc/pam.d/sudo ──
# auth  sufficient  pam_bio.so
# auth  include     system-auth
# account include   system-auth
# session include   system-auth
