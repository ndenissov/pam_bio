name: Build and Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build-deb:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          
      - name: Install build dependencies
        run: sudo apt-get update || true; sudo apt-get install -y libpam0g-dev build-essential

      - name: Build Debian packages
        run: ./packaging/build-deb.sh
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages
          path: |
            pambiod_*.deb
            pam-bio_*.deb

  build-windows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install MinGW and CMake
        run: sudo apt-get update || true; sudo apt-get install -y mingw-w64 cmake

      - name: Build Windows binaries
        run: ./build_windows.sh
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            daemon/pambiod.exe
            windows_cp/build/pambio_cp.dll

  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Create Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            cat <<EOF > android/app/keystore.properties
            storeFile=release.keystore
            storePassword=$ANDROID_KEYSTORE_PASSWORD
            keyAlias=$ANDROID_KEY_ALIAS
            keyPassword=$ANDROID_KEY_PASSWORD
            EOF
          else
            echo "No Android Keystore secrets found. Building unsigned APK."
          fi

      - name: Build with Gradle
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Rename APKs
        run: |
          cd android/app/build/outputs/apk/release
          if [ -f "app-universal-release.apk" ]; then mv app-universal-release.apk pam-bio-universal-release.apk; fi
          if [ -f "app-arm64-v8a-release.apk" ]; then mv app-arm64-v8a-release.apk pam-bio-arm64-v8a-release.apk; fi
          if [ -f "app-armeabi-v7a-release.apk" ]; then mv app-armeabi-v7a-release.apk pam-bio-armeabi-v7a-release.apk; fi
          if [ -f "app-x86_64-release.apk" ]; then mv app-x86_64-release.apk pam-bio-x86_64-release.apk; fi
          if [ -f "app-x86-release.apk" ]; then mv app-x86-release.apk pam-bio-x86-release.apk; fi
          
          if [ -f "app-universal-release-unsigned.apk" ]; then mv app-universal-release-unsigned.apk pam-bio-universal-release-unsigned.apk; fi
          if [ -f "app-arm64-v8a-release-unsigned.apk" ]; then mv app-arm64-v8a-release-unsigned.apk pam-bio-arm64-v8a-release-unsigned.apk; fi
          if [ -f "app-armeabi-v7a-release-unsigned.apk" ]; then mv app-armeabi-v7a-release-unsigned.apk pam-bio-armeabi-v7a-release-unsigned.apk; fi
          if [ -f "app-x86_64-release-unsigned.apk" ]; then mv app-x86_64-release-unsigned.apk pam-bio-x86_64-release-unsigned.apk; fi
          if [ -f "app-x86-release-unsigned.apk" ]; then mv app-x86-release-unsigned.apk pam-bio-x86-release-unsigned.apk; fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: android/app/build/outputs/apk/release/*.apk

  release:
    needs: [build-deb, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Flatten artifacts
        run: |
          find artifacts -type f -exec mv {} . \;
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.deb
            *.exe
            *.dll
            *.apk
          generate_release_notes: true
